# Purpose: Generate Datadog with APM

apiVersion: batch/v1
kind: Job
metadata:
  name: test-datadog
  namespace: default
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        tags.datadoghq.com/service: test-datadog  # required
        admission.datadoghq.com/enabled: "true"
      # annotations:
        # admission.datadoghq.com/js-lib.version: "v1.0.0"
        # admission.datadoghq.com/ruby-lib.version: "v1.0.0"
    spec:
      restartPolicy: Never
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: test-datadog
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Run for 1 minutes, emit JSON logs every 2 seconds
          end=$(($(date +%s) + 60))
          while [ $(date +%s) -lt $end ]; do
            echo "{\"level\":\"info\",\"timestamp\":\"$(date -Iseconds)\",\"message\":\"Processing request\",\"request_id\":\"$(cat /dev/urandom | tr -dc 'a-z0-9' | head -c 8)\"}"
            sleep 1
            echo "{\"level\":\"error\",\"timestamp\":\"$(date -Iseconds)\",\"message\":\"Failed to connect to database\",\"error\":\"connection timeout\"}" >&2
            sleep 1
          done
