apiVersion: v1
kind: Service
metadata:
  name: nginx
  annotations: {}
    # external-dns.alpha.kubernetes.io/hostname: nginx.workload-nonprod.internal
    # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  # type: NodePort
  # ports:
  # - port: 30001
  #   nodePort: 30001
  #   name: http
  #   targetPort: 80
  # selector:
  #   app: nginx
  type: ClusterIP
  ports:
  - port: 80
    name: http
    targetPort: 80
  selector:
    app: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  annotations: {}
    # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    # external-dns.alpha.kubernetes.io/hostname: nginx.workload-nonprod.internal
spec:
  ingressClassName: internal-ingress-nginx
  rules:
  - host: "nginx.nonprod.internal"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginxs
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      nodeSelector:
        eks.abacusdigital.com/workload: "general-purpose"
      tolerations:
        - key: "eks.abacusdigital.com/workload"
          operator: "Equal"
          value: "general-purpose"
          effect: "NoSchedule"
