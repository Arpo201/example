<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Page — Live Reload</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1c2128 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e6edf3;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 48px 56px;
    text-align: center;
    max-width: 520px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 28px; margin-bottom: 12px; color: #58a6ff; }
  p { font-size: 15px; color: #8b949e; line-height: 1.6; margin-bottom: 24px; }
  .badge {
    display: inline-block;
    background: #238636;
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .meta {
    margin-top: 24px;
    font-size: 12px;
    color: #484f58;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🧪</div>
    <h1>Test Page</h1>
    <p>If you can see this in the sidebar and it loaded automatically, live reload is working correctly.</p>
    <span class="badge">✅ Auto-refresh active</span>
    <div class="meta">Created to verify SSE file watching &amp; sidebar updates</div>
  </div>
</body>
</html>
